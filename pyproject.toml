[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sidescroller-rl"
version = "0.2.0"
description = "Reproducible DQN experiments on a teacher-provided Pygame shooter"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["numpy==2.2.1", "pygame==2.6.1", "gymnasium==1.1.1", "torch==2.5.1"]

[project.scripts]
sidescroller-train = "sidescroller.rl.train:main"
sidescroller-play = "sidescroller.rl.playback:cli"
sidescroller-game = "sidescroller.game.shooter:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sidescroller = ["assets/**/*"]
